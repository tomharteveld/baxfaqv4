<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bax Music FAQ Frontend</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-lockup" aria-label="Bax Music FAQ tool">
          <div class="brand-logos" aria-label="Follo Agency x Bax Music">
            <img class="follo-logo" src="./assets/follo-logo-cropped.png" alt="Follo Agency">
            <span class="brand-x">x</span>
            <img class="bax-logo" src="./assets/baxmusic-logo-cropped.png" alt="Bax Music">
          </div>
          <div>
            <p class="eyebrow">Follo Agency x Bax Music</p>
            <h1>PDP FAQ review</h1>
          </div>
        </div>
        <div class="topbar-actions">
          <label class="import-button" for="csvImportInput">Importeer CSV</label>
          <input class="visually-hidden" id="csvImportInput" type="file" accept=".csv,text/csv">
          <button class="secondary-button" id="resetDataButton" type="button" hidden>Reset data</button>
          <button class="secondary-button" id="copyVisibleButton" type="button">Kopieer zichtbare FAQ's</button>
          <button class="primary-button" id="exportButton" type="button">Exporteer CSV</button>
        </div>
      </header>

      <main class="workspace">
        <section class="summary-band" aria-label="Samenvatting">
          <div class="stat">
            <span class="stat-value" id="faqCount">0</span>
            <span class="stat-label">FAQ's</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="productCount">0</span>
            <span class="stat-label">Producten</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="categoryCount">0</span>
            <span class="stat-label">Categorieen</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="sourceCount">0</span>
            <span class="stat-label">Bronnen</span>
          </div>
          <div class="coverage-panel">
            <div>
              <span class="mini-label">Inputdekking</span>
              <strong id="coverageLabel">0%</strong>
            </div>
            <div class="coverage-track" aria-hidden="true">
              <span id="gapCoverage"></span>
              <span id="eeatCoverage"></span>
            </div>
          </div>
        </section>

        <section class="data-status" aria-live="polite">
          <span id="dataStatus">Standaard dataset geladen</span>
        </section>

        <section class="backend-panel" aria-label="Backend versiebeheer">
          <div class="backend-state">
            <span class="mini-label">Backend</span>
            <strong id="backendMode">Niet verbonden</strong>
          </div>
          <label class="select-control version-control">
            <span>Sheet-versie</span>
            <select id="versionSelect" disabled></select>
          </label>
          <button class="secondary-button" id="activateVersionButton" type="button" disabled>Activeer versie</button>
          <button class="secondary-button" id="refreshVersionsButton" type="button" disabled>Ververs</button>
        </section>

        <section class="controls-band" aria-label="Filters">
          <label class="search-control">
            <span>Zoeken</span>
            <input id="searchInput" type="search" placeholder="Product, segment, prijs, vraag, antwoord, bron of input">
          </label>
          <label class="select-control">
            <span>Categorie</span>
            <select id="categorySelect"></select>
          </label>
          <label class="select-control">
            <span>Gebruikte input</span>
            <select id="sourceSelect"></select>
          </label>
        </section>

        <section class="content-grid">
          <aside class="product-rail" aria-label="Producten">
            <div class="rail-head">
              <h2>Producten</h2>
              <span id="visibleProductCount">0</span>
            </div>
            <div class="product-list" id="productList"></div>
          </aside>

          <section class="detail-pane" aria-live="polite">
            <div class="product-hero">
              <div class="hero-copy">
                <p class="eyebrow" id="selectedCategory">Categorie</p>
                <h2 id="selectedProduct">Selecteer een product</h2>
                <p id="selectedDescription"></p>
              </div>
              <div class="hero-actions">
                <a class="secondary-link" id="pdpLink" href="#" target="_blank" rel="noreferrer">Open PDP</a>
                <button class="secondary-button" id="copyProductButton" type="button">Kopieer product FAQ's</button>
              </div>
            </div>

            <div class="meta-strip" id="metaStrip"></div>

            <div class="faq-view-shell">
              <div class="faq-toolbar">
                <h3 id="faqHeading">FAQ's</h3>
                <div class="view-toggle" role="tablist" aria-label="FAQ weergave">
                  <button class="view-button active" id="cardsTab" data-view="cards" type="button" role="tab" aria-selected="true" aria-controls="cardsPanel">Kaarten</button>
                  <button class="view-button" id="tableTab" data-view="table" type="button" role="tab" aria-selected="false" aria-controls="tablePanel">Tabel</button>
                </div>
              </div>

              <div class="view-panels">
                <section class="view-panel active" id="cardsPanel" role="tabpanel" aria-labelledby="cardsTab">
                  <div id="faqCards" class="faq-list"></div>
                </section>
                <section class="view-panel" id="tablePanel" role="tabpanel" aria-labelledby="tableTab" hidden>
                  <div id="faqTableWrap" class="table-wrap">
                    <table>
                      <thead>
                        <tr>
                          <th>Segment</th>
                          <th>Prijs</th>
                          <th>Vraag</th>
                          <th>Antwoord</th>
                          <th>PAA</th>
                          <th>AIO</th>
                          <th>ChatGPT</th>
                          <th>Reddit</th>
                          <th>Reviews</th>
                          <th>Specs</th>
                          <th>Gap</th>
                        </tr>
                      </thead>
                      <tbody id="faqTableBody"></tbody>
                    </table>
                  </div>
                </section>
              </div>
            </div>
          </section>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
